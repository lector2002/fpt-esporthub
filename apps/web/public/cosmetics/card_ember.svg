<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="120" viewBox="0 0 120 120">
<style>
  .fl { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 2.2s ease-in-out infinite alternate; }
  .fl.b { animation-duration: 2s; animation-delay: -.5s; }
  .fl.c { animation-duration: 2.6s; animation-delay: -1.1s; }
  .pulse { animation: pulse 3.2s ease-in-out infinite; }
  .pulse.b { animation-delay: -1.6s; }
  .smoke { transform-box: fill-box; transform-origin: 50% 100%; animation: smoke 5s ease-in-out infinite; }
  .smoke.b { animation-delay: -2.5s; }
  .spark { animation: rise 3s linear infinite; }
  .spark.b { animation-delay: -1.5s; animation-duration: 3.6s; }
  .spk2 { animation: rise2 2.4s linear infinite; }
.spark, .spk2 { opacity: 0; }
@keyframes flick {
  0% { transform: scale(1, 1) skewX(0deg); }
  35% { transform: scale(.94, 1.08) skewX(-4deg); }
  70% { transform: scale(1.04, .9) skewX(3deg); }
  100% { transform: scale(.97, 1.05) skewX(-2deg); }
}
@keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
@keyframes smoke {
  0% { opacity: 0; transform: translateY(3px) scale(.8); }
  40% { opacity: .55; }
  100% { opacity: 0; transform: translateY(-4px) scale(1.15); }
}
@keyframes rise {
  0% { opacity: 0; transform: translateY(0); }
  20% { opacity: 1; }
  75% { opacity: .8; }
  100% { opacity: 0; transform: translateY(-30px); }
}
@keyframes rise2 {
  0% { opacity: 0; transform: translateY(0); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-14px); }
}
</style>
<defs>
  <clipPath id="cT"><rect x="40" y="0" width="40" height="40"/></clipPath>
  <clipPath id="cC"><rect x="0" y="0" width="40" height="40"/></clipPath>
  <clipPath id="cB"><rect x="40" y="80" width="40" height="40"/></clipPath>
  <clipPath id="cBL"><rect x="0" y="80" width="40" height="40"/></clipPath>
  <clipPath id="cBR"><rect x="80" y="80" width="40" height="40"/></clipPath>
  <clipPath id="cL"><rect x="0" y="40" width="40" height="40"/></clipPath>
  <clipPath id="cR"><rect x="80" y="40" width="40" height="40"/></clipPath>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.5"/></filter>
  <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.6"/></filter>
  <linearGradient id="fadeT" gradientUnits="userSpaceOnUse" x1="0" y1="21" x2="0" y2="34">
    <stop offset="0" stop-color="#ff7a1a" stop-opacity=".12"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fadeB" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="80">
    <stop offset="0" stop-color="#ff6a1a" stop-opacity=".3"/><stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
  </linearGradient>

  <!-- rock band shapes (top orientation) -->
  <path id="rkE" d="M26,-5H96V20.5L95,20L87,22.5L80,19L74,21.5L68,19.5L61,23L55,20L47,22.5L40,19L34,21.5L28,19.5L26,20.5Z"/>
  <path id="rkC" d="M-5,-5H46V22L40,19L34,21.5L28,19.5L21,23L15,20L8,22.5L0,19L-5,20Z"/>
  <path id="crE" d="M30,11.3L32,12L36,8L40,9L45,7L50,11L56,8.5L62,12.5L66,10L72,12L76,8L80,9L85,7L90,11M56,8.5L58.5,14L55.5,19.5M72,12L73.5,16.5"/>
  <path id="crC" d="M46,8L45,7L40,9L36,8L32,12L28,11L24,13.5"/>

  <!-- cel-shaded flame, origin at its base -->
  <path id="fp" d="M0,1C-4,1 -6.8,-1.5 -6.2,-5.5C-5.6,-9 -3.2,-10.5 -3,-14C-1.4,-12 -.6,-10.6 -.4,-9C.8,-12 .2,-15.5 -1.2,-19C3.6,-16.5 7,-11.5 6.6,-6C6.3,-1.8 3.6,1 0,1Z"/>
  <g id="flame">
    <use xlink:href="#fp" fill="#e2461b" stroke="#1d1a22" stroke-width="1.2" stroke-linejoin="round"/>
    <use xlink:href="#fp" fill="#ff8a1f" transform="translate(.5,-.3) scale(.72)"/>
    <use xlink:href="#fp" fill="#ffd35a" transform="translate(.7,-.4) scale(.46)"/>
    <use xlink:href="#fp" fill="#fff4c8" transform="translate(.8,-.5) scale(.22)"/>
    <ellipse cx="-3.3" cy="-5.5" rx=".7" ry="1.3" fill="#fff" opacity=".8" transform="rotate(20 -3.3 -5.5)"/>
  </g>

  <!-- smoke wisp, origin at its base -->
  <filter id="soft" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation=".7"/></filter>
  <g id="wisp" fill="none" stroke-linecap="round" filter="url(#soft)">
    <path d="M0,0C2.4,-2 -1.6,-4 .6,-6.4C2.6,-8.6 .4,-10.4 2.4,-12" stroke="#b3a8b8" stroke-width="3" opacity=".35"/>
    <path d="M-.4,-.6C1.6,-2.2 -1.8,-4 .2,-6.2" stroke="#e6dde8" stroke-width="1.2" opacity=".35"/>
  </g>

  <g id="spark"><circle r="1.8" fill="#ff8a1f" filter="url(#glow)"/><circle r=".75" fill="#fff0b0"/></g>

  <!-- top rock tile, x 40..80 -->
  <g id="rockE" clip-path="url(#cT)" stroke-linejoin="round">
    <use xlink:href="#rkE" fill="none" stroke="#1d1a22" stroke-width="2.6"/>
    <use xlink:href="#rkE" fill="#262026"/>
    <use xlink:href="#rkE" fill="#40343a" transform="translate(0,-2.6)"/>
    <path d="M43,2.6L52,2L50,4.8L44.5,5.3ZM63,3.4L70.5,2.6L69,5.2L64,5.8ZM57,15L61.5,14.2L60.5,16.4Z" fill="#6a5660"/>
    <circle cx="47" cy="3.6" r=".6" fill="#fff" opacity=".6"/>
    <use xlink:href="#crE" fill="none" stroke="#ff5a0a" stroke-width="4.2" filter="url(#glow)" class="pulse" opacity=".8"/>
    <use xlink:href="#crE" fill="none" stroke="#1d1a22" stroke-width="2.6" stroke-linecap="round"/>
    <use xlink:href="#crE" fill="none" stroke="#ff7a1a" stroke-width="1.5" stroke-linecap="round"/>
    <use xlink:href="#crE" fill="none" stroke="#ffe08a" stroke-width=".85" stroke-linecap="round" class="pulse b"/>
    <circle cx="48" cy="15.5" r="1.9" fill="#ff7a1a" filter="url(#glow)" class="pulse b"/>
    <circle cx="48" cy="15.5" r=".8" fill="#ffd35a"/>
    <circle cx="67" cy="4.6" r=".7" fill="#ffd35a"/>
  </g>

  <!-- top-left rock corner (no boulder) -->
  <g id="rockC" clip-path="url(#cC)" stroke-linejoin="round">
    <use xlink:href="#rkC" fill="none" stroke="#1d1a22" stroke-width="2.6"/>
    <use xlink:href="#rkC" fill="none" stroke="#1d1a22" stroke-width="2.6" transform="matrix(0,1,1,0,0,0)"/>
    <use xlink:href="#rkC" fill="#262026"/>
    <use xlink:href="#rkC" fill="#262026" transform="matrix(0,1,1,0,0,0)"/>
    <use xlink:href="#rkC" fill="#40343a" transform="translate(0,-2.6)"/>
    <use xlink:href="#rkC" fill="#40343a" transform="matrix(0,1,1,0,-2.6,0)"/>
    <path d="M24,3L32,2.4L30.5,5L25,5.6ZM3,26L2.4,33L5,31.5L5.6,27Z" fill="#6a5660"/>
    <g fill="none" stroke-linecap="round">
      <use xlink:href="#crC" stroke="#ff5a0a" stroke-width="4.2" filter="url(#glow)" class="pulse" opacity=".8"/>
      <use xlink:href="#crC" stroke="#ff5a0a" stroke-width="4.2" filter="url(#glow)" class="pulse" opacity=".8" transform="matrix(0,1,1,0,0,0)"/>
      <use xlink:href="#crC" stroke="#1d1a22" stroke-width="2.6"/>
      <use xlink:href="#crC" stroke="#1d1a22" stroke-width="2.6" transform="matrix(0,1,1,0,0,0)"/>
      <use xlink:href="#crC" stroke="#ff7a1a" stroke-width="1.5"/>
      <use xlink:href="#crC" stroke="#ff7a1a" stroke-width="1.5" transform="matrix(0,1,1,0,0,0)"/>
      <use xlink:href="#crC" stroke="#ffe08a" stroke-width=".85" class="pulse b"/>
      <use xlink:href="#crC" stroke="#ffe08a" stroke-width=".85" class="pulse b" transform="matrix(0,1,1,0,0,0)"/>
    </g>
  </g>

  <!-- corner boulder for the top corners -->
  <path id="bo" d="M-2,-2L22,2L28.5,11.5L27.5,21.5L22,27.5L11.5,28.5L2,22Z"/>
  <clipPath id="cBo"><use xlink:href="#bo"/></clipPath>
  <g id="boulder" stroke-linejoin="round">
    <use xlink:href="#bo" fill="#262026" stroke="#1d1a22" stroke-width="2.6"/>
    <g clip-path="url(#cBo)">
      <use xlink:href="#bo" fill="#40343a" transform="translate(-2.4,-2.4)"/>
      <path d="M6,4L17,4.5L13,8.5L5,9.5Z" fill="#6a5660"/>
      <circle cx="8" cy="6" r=".8" fill="#fff" opacity=".6"/>
    </g>
    <g fill="none" stroke-linecap="round">
      <path d="M24,13.5L18,14L15,19.5L20.5,24M15,19.5L10.5,20.5L8,25" stroke="#ff5a0a" stroke-width="4.2" filter="url(#glow)" class="pulse b" opacity=".8"/>
      <path d="M24,13.5L18,14L15,19.5L20.5,24M15,19.5L10.5,20.5L8,25" stroke="#1d1a22" stroke-width="2.6"/>
      <path d="M24,13.5L18,14L15,19.5L20.5,24M15,19.5L10.5,20.5L8,25" stroke="#ff7a1a" stroke-width="1.5"/>
      <path d="M24,13.5L18,14L15,19.5L20.5,24M15,19.5L10.5,20.5L8,25" stroke="#ffe08a" stroke-width=".85" class="pulse"/>
    </g>
  </g>
  <path id="bedP" d="M0,108V103Q2.5,98.5 5,103Q7.5,100.5 10,103Q12.5,98.5 15,103Q17.5,100.5 20,103Q22.5,98.5 25,103Q27.5,100.5 30,103Q32.5,98.5 35,103Q37.5,100.5 40,103Q42.5,98.5 45,103Q47.5,100.5 50,103Q52.5,98.5 55,103Q57.5,100.5 60,103Q62.5,98.5 65,103Q67.5,100.5 70,103Q72.5,98.5 75,103Q77.5,100.5 80,103Q82.5,98.5 85,103Q87.5,100.5 90,103Q92.5,98.5 95,103Q97.5,100.5 100,103Q102.5,98.5 105,103Q107.5,100.5 110,103Q112.5,98.5 115,103Q117.5,100.5 120,103V108Z"/>
  <linearGradient id="bedG" gradientUnits="userSpaceOnUse" x1="0" y1="99" x2="0" y2="111">
    <stop offset="0" stop-color="#ff8a1f"/><stop offset=".45" stop-color="#e2461b"/><stop offset="1" stop-color="#e2461b" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="bedY" gradientUnits="userSpaceOnUse" x1="0" y1="101" x2="0" y2="108">
    <stop offset="0" stop-color="#ffd35a"/><stop offset="1" stop-color="#ffd35a" stop-opacity="0"/>
  </linearGradient>
  <g id="bed">
    <use xlink:href="#bedP" fill="url(#bedG)"/>
    <use xlink:href="#bedP" fill="url(#bedY)" transform="translate(0,2.4)" class="pulse b"/>
    <path d="M0,103Q2.5,98.5 5,103Q7.5,100.5 10,103Q12.5,98.5 15,103Q17.5,100.5 20,103Q22.5,98.5 25,103Q27.5,100.5 30,103Q32.5,98.5 35,103Q37.5,100.5 40,103Q42.5,98.5 45,103Q47.5,100.5 50,103Q52.5,98.5 55,103Q57.5,100.5 60,103Q62.5,98.5 65,103Q67.5,100.5 70,103Q72.5,98.5 75,103Q77.5,100.5 80,103Q82.5,98.5 85,103Q87.5,100.5 90,103Q92.5,98.5 95,103Q97.5,100.5 100,103Q102.5,98.5 105,103Q107.5,100.5 110,103Q112.5,98.5 115,103Q117.5,100.5 120,103" fill="none" stroke="#1d1a22" stroke-width="1.1" stroke-linejoin="round"/>
  </g>
</defs>

<!-- rock edges -->
<use xlink:href="#rockE"/>
<use xlink:href="#rockE" transform="translate(0,120) scale(1,-1)"/>
<use xlink:href="#rockE" transform="matrix(0,1,1,0,0,0)"/>
<use xlink:href="#rockE" transform="matrix(0,1,-1,0,120,0)"/>

<!-- bottom edge fire glow + flames --><g clip-path="url(#cB)">
<rect x="40" y="80" width="40" height="20" fill="url(#fadeB)"/>
<ellipse cx="59" cy="102" rx="16" ry="6" fill="#ff5a0a" opacity=".55" filter="url(#glow2)" class="pulse"/>
<use xlink:href="#bed"/>
<g transform="translate(50,106) scale(.9)"><g class="fl"><use xlink:href="#flame"/></g></g>
<g transform="translate(68.5,106) scale(-.75,.75)"><g class="fl b"><use xlink:href="#flame"/></g></g>
<g transform="translate(59.5,104.5) scale(.5)"><g class="fl c"><use xlink:href="#flame"/></g></g>
<use xlink:href="#spark" x="58" y="97" class="spk2"/></g>

<!-- top edge smoke -->
<g transform="translate(49,19)"><g class="smoke"><use xlink:href="#wisp"/></g></g>
<g transform="translate(69,20) scale(-1,1)"><g class="smoke b"><use xlink:href="#wisp"/></g></g>

<!-- rising sparks on the side edges -->
<g clip-path="url(#cL)"><use xlink:href="#spark" x="11" y="76" class="spark"/><use xlink:href="#spark" x="16" y="76" class="spark b"/></g>
<g clip-path="url(#cR)"><use xlink:href="#spark" x="109" y="76" class="spark b"/><use xlink:href="#spark" x="104" y="76" class="spark"/></g>

<!-- corners -->
<use xlink:href="#rockC"/>
<use xlink:href="#rockC" transform="translate(120,0) scale(-1,1)"/>
<use xlink:href="#rockC" transform="translate(0,120) scale(1,-1)"/>
<use xlink:href="#rockC" transform="translate(120,120) scale(-1,-1)"/>
<use xlink:href="#boulder"/>
<use xlink:href="#boulder" transform="translate(120,0) scale(-1,1)"/>
<g transform="translate(31,20)"><g class="smoke b"><use xlink:href="#wisp"/></g></g>
<g transform="translate(89,20) scale(-1,1)"><g class="smoke"><use xlink:href="#wisp"/></g></g>

<!-- bottom-left corner fire --><g clip-path="url(#cBL)">
<rect x="21" y="80" width="19" height="20" fill="url(#fadeB)"/>
<ellipse cx="18" cy="104" rx="14" ry="8" fill="#ff5a0a" opacity=".6" filter="url(#glow2)" class="pulse b"/>
<use xlink:href="#bed"/>
<g transform="translate(9,97) scale(.62)"><g class="fl c"><use xlink:href="#flame"/></g></g>
<g transform="translate(28,106) scale(-.8,.8)"><g class="fl b"><use xlink:href="#flame"/></g></g>
<g transform="translate(15,109) scale(1.15)"><g class="fl"><use xlink:href="#flame"/></g></g>
</g><!-- bottom-right corner fire --><g clip-path="url(#cBR)">
<rect x="80" y="80" width="19" height="20" fill="url(#fadeB)"/>
<ellipse cx="102" cy="104" rx="14" ry="8" fill="#ff5a0a" opacity=".6" filter="url(#glow2)" class="pulse"/>
<use xlink:href="#bed"/>
<g transform="translate(111,97) scale(-.62,.62)"><g class="fl"><use xlink:href="#flame"/></g></g>
<g transform="translate(92,106) scale(.8)"><g class="fl c"><use xlink:href="#flame"/></g></g>
<g transform="translate(105,109) scale(-1.15,1.15)"><g class="fl b"><use xlink:href="#flame"/></g></g>
</g>
</svg>
